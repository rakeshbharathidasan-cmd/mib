<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MIB</title>
<meta name="theme-color" content="#060912">
<meta name="color-scheme" content="dark only">
<meta name="darkreader-lock">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* One-column phone app behind PIN/fingerprint. Home = net-worth orb + buckets + accounts; Holdings; Ideas (pipeline + IPOs); Journal.
   Single committed dark look: ink-navy ground, emerald gains, coral losses, gold for the brand. */
:root{
  color-scheme:dark;
  --bg:#060912; --s1:#0d1322; --s2:#131b2f; --s3:#1c2640; --line:#1a2440; --line2:#263357;
  --text:#eef3ff; --muted:#93a0c3; --faint:#5b6890;
  --up:#2ee59d; --dn:#ff5d73; --gold:#ffc54d; --cyan:#3cc8ff; --vio:#9d7bff; --pink:#ff6ec7;
  --b-ipo:#ffc54d; --b-lst:#ff6ec7; --b-inv:#3cc8ff; --b-spec:#9d7bff;
  --disp:'Sora',system-ui,sans-serif; --body:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:14.5px/1.45 var(--body);max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px calc(env(safe-area-inset-bottom,0px) + 96px);
  background:radial-gradient(640px 420px at 0% -10%,rgba(60,200,255,.12),transparent 60%),radial-gradient(600px 420px at 110% 0%,rgba(157,123,255,.14),transparent 60%),radial-gradient(700px 500px at 50% 115%,rgba(46,229,157,.07),transparent 60%),var(--bg);background-attachment:fixed;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
input,textarea,select{font:inherit;color:var(--text);background:var(--s2);border:1px solid var(--line2);border-radius:13px;padding:11px 12px;width:100%;color-scheme:dark;user-select:text}
textarea{resize:vertical;min-height:72px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12.5px}
.up{color:var(--up)} .dn{color:var(--dn)}

header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(140deg,#ffd77a,#ff9d4d 45%,#ff6ec7);box-shadow:0 0 22px -6px rgba(255,197,77,.85);font-family:var(--disp);font-weight:800;font-size:12px;color:#060912;letter-spacing:.5px}
.brand b{font-family:var(--disp);font-weight:800;font-size:22px;letter-spacing:3px;background:linear-gradient(90deg,#ffe3a0,#ffb36b 50%,#ff9ed8);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;font-size:11.5px;color:var(--faint);margin-top:-2px}
.hr{display:flex;gap:6px}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted);background:var(--s1);border:1px solid var(--line)}
.icon-btn.spin .ic{animation:rot 1s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

#view{animation:pg .32s cubic-bezier(.2,.9,.3,1)}
#view.l{animation-name:pgl} #view.r{animation-name:pgr}
@keyframes pg{from{opacity:0;transform:translateY(10px)}}
@keyframes pgl{from{opacity:0;transform:translateX(-26px)}}
@keyframes pgr{from{opacity:0;transform:translateX(26px)}}
.card{background:linear-gradient(180deg,rgba(19,27,47,.82),rgba(13,19,34,.94));border:1px solid var(--line);border-radius:22px;padding:15px;margin-bottom:12px;position:relative}
.ch{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.ch h3{margin:0;font-size:11.5px;font-weight:800;color:var(--muted);letter-spacing:1.2px;text-transform:uppercase}
.lnk{font-size:12.5px;color:#9fdcff;font-weight:700;padding:4px 2px}
.demo{font-size:12.5px;color:var(--gold);background:rgba(255,197,77,.07);border:1px solid rgba(255,197,77,.25);border-radius:14px;padding:9px 12px;margin-bottom:12px}

/* hero */
.hero{padding:16px;overflow:hidden;background:radial-gradient(260px 220px at 82% 30%,color-mix(in srgb,var(--pc) 22%,transparent),transparent 70%),linear-gradient(180deg,rgba(19,27,47,.9),rgba(10,14,26,.97));border-color:color-mix(in srgb,var(--pc) 30%,var(--line))}
.hgrid{display:grid;grid-template-columns:minmax(0,1fr) 112px;gap:10px;align-items:center}
.lab{font-size:11.5px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:700}
.big{font-family:var(--disp);font-weight:800;font-size:34px;line-height:1.05;letter-spacing:-.8px;margin:4px 0 6px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.pl{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px}
.pl b{font-family:var(--disp);font-weight:700}
.orb{width:112px;height:112px;border-radius:50%;position:relative;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--pc) 70%,#fff),var(--pc) 45%,color-mix(in srgb,var(--pc) 35%,#000) 100%);
  box-shadow:0 0 40px -6px var(--pc),inset 0 -10px 24px rgba(0,0,0,.35);animation:breathe 3.2s ease-in-out infinite}
.orb::before{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid color-mix(in srgb,var(--pc) 55%,transparent);animation:ring 3.2s ease-out infinite}
.orb span{font-family:var(--disp);font-weight:800;font-size:19px;color:#060912;text-align:center;line-height:1.05}
.orb span small{display:block;font-size:10px;font-weight:700;opacity:.75}
@keyframes breathe{50%{transform:scale(1.05)}}
@keyframes ring{from{transform:scale(.88);opacity:.9}to{transform:scale(1.25);opacity:0}}
.mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.mini>div{background:rgba(6,9,18,.5);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-width:0}
.mini .k{font-size:10.5px;color:var(--muted)} .mini .v{font-family:var(--disp);font-weight:700;font-size:14.5px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pricebar{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11.5px;color:var(--faint);margin-top:10px}
.pricebar button{color:#9fdcff;font-weight:700}

.fl{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 10px;padding:0 16px 2px}
.fl::-webkit-scrollbar{display:none}
.fc{flex:none;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;background:var(--s1);border:1px solid var(--line);font-size:12.5px;color:var(--muted);font-weight:700;white-space:nowrap}
.fc i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.fc.on{color:var(--text);border-color:var(--c,#3cc8ff);background:color-mix(in srgb,var(--c,#3cc8ff) 16%,var(--s1));box-shadow:0 0 14px -6px var(--c,#3cc8ff)}

.buckets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:12px}
.bk{text-align:left;padding:12px;border-radius:18px;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 16%,var(--s1)),var(--s1) 70%);border:1px solid color-mix(in srgb,var(--c) 38%,transparent);min-width:0;position:relative;overflow:hidden}
.bk .n{font-size:12px;font-weight:800;color:var(--c);display:flex;align-items:center;gap:6px}
.bk .v{font-family:var(--disp);font-weight:700;font-size:18px;margin-top:4px;font-variant-numeric:tabular-nums}
.bk .p{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.bk .s{font-size:11px;color:var(--faint);margin-top:2px}
.bk .spark{position:absolute;right:-14px;top:-14px;width:54px;height:54px;border-radius:50%;background:var(--c);opacity:.12;filter:blur(2px)}

.acc{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;padding:10px 2px;border-bottom:1px solid var(--line)}
.acc:last-child{border-bottom:0}
.acc i{width:10px;height:28px;border-radius:5px;background:var(--c);box-shadow:0 0 10px var(--c)}
.acc .r{text-align:right;font-variant-numeric:tabular-nums}
.acc .r b{display:block;font-family:var(--disp);font-size:14.5px}
.stack{display:flex;height:10px;border-radius:10px;overflow:hidden;margin:4px 0 8px;background:var(--s3)}
.stack b{height:100%;transition:width .9s cubic-bezier(.2,.9,.3,1)}

/* holding row */
.hold{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:11px;width:100%;text-align:left;padding:11px 12px 11px 0;border-radius:16px;background:var(--s1);border:1px solid var(--line);margin-bottom:8px;overflow:hidden;animation:rise .35s both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.hold .bar{background:var(--c);border-radius:0 4px 4px 0;box-shadow:0 0 10px var(--c)}
.hold .sym{font-family:var(--disp);font-weight:700;font-size:15.5px}
.hold .meta{display:flex;flex-wrap:wrap;gap:4px 8px;font-size:11.5px;color:var(--muted);margin-top:4px;align-items:center}
.hold .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.hold .r b{display:block;font-family:var(--disp);font-size:15px}
.hold .r span{font-size:12px;font-weight:700}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:10.5px;font-weight:800;color:var(--c,var(--muted));background:color-mix(in srgb,var(--c,#93a0c3) 14%,transparent);border:1px solid color-mix(in srgb,var(--c,#93a0c3) 32%,transparent);white-space:nowrap}
.tot{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--muted);margin:2px 2px 10px}
.tot b{color:var(--text);font-variant-numeric:tabular-nums}
.sech{font-size:11px;color:var(--faint);font-weight:800;letter-spacing:.8px;text-transform:uppercase;margin:16px 2px 8px;display:flex;justify-content:space-between}

/* ideas */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:4px;border-radius:14px;background:var(--s1);border:1px solid var(--line);margin-bottom:12px}
.seg button{padding:9px 4px;border-radius:10px;font-weight:800;color:var(--muted);font-size:13px;white-space:nowrap}
.seg button.on{color:#060912;background:linear-gradient(135deg,#ffd77a,#ff9d4d 55%,#ff9ed8)}
.stg{display:flex;gap:4px;margin-bottom:12px}
.stg button{flex:1;padding:9px 2px;border-radius:12px;background:var(--s1);border:1px solid var(--line);font-size:12px;font-weight:800;color:var(--muted);text-align:center}
.stg button b{display:block;font-family:var(--disp);font-size:17px;color:var(--c)}
.stg button.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--s1));color:var(--text)}
.idea{display:block;width:100%;text-align:left;padding:12px 14px;border-radius:16px;background:var(--s1);border:1px solid var(--line);border-left:4px solid var(--c);margin-bottom:8px;animation:rise .35s both}
.idea .t{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.idea .t b{font-family:var(--disp);font-size:15.5px}
.idea p{margin:5px 0 0;font-size:13px;color:var(--muted);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.idea .m{display:flex;flex-wrap:wrap;gap:5px 10px;font-size:11.5px;color:var(--faint);margin-top:6px}

/* opinions by stock */
.vt{display:flex;justify-content:flex-end;gap:4px;margin:-4px 0 10px}
.vt button{padding:5px 11px;border-radius:99px;font-size:11.5px;font-weight:800;color:var(--muted);border:1px solid var(--line);background:var(--s1)}
.vt button.on{color:var(--text);border-color:#ffc54d;background:color-mix(in srgb,#ffc54d 14%,var(--s1))}
.trail{display:flex;flex-wrap:wrap;gap:2px;font-size:15px;margin-top:6px;align-items:center}
.trail i{font-style:normal;color:var(--faint);font-size:10px;margin:0 1px}
.tl{position:relative;padding-left:22px;margin-top:6px}
.tl::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line2);border-radius:2px}
.tle{position:relative;padding:8px 10px;border-radius:12px;background:var(--s2);border:1px solid var(--line);margin-bottom:8px;animation:rise .3s both}
.tle::before{content:"";position:absolute;left:-19px;top:12px;width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.tle .d{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--faint)}
.tle b{font-size:13px}
.tle p{margin:3px 0 0;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}
.stg.mood button b{font-size:19px;font-family:inherit}
/* journal */
.moods{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.moods button{padding:8px 0 6px;border-radius:14px;background:var(--s2);border:1px solid var(--line2);text-align:center;font-size:24px;line-height:1.1;transition:transform .15s}
.moods button small{display:block;font-size:10px;color:var(--muted);font-weight:700;margin-top:2px}
.moods button.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 20%,var(--s2));transform:translateY(-3px);box-shadow:0 8px 18px -10px var(--c)}
.jr{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;width:100%;text-align:left;padding:11px 12px;border-radius:16px;background:var(--s1);border:1px solid var(--line);margin-bottom:8px;animation:rise .35s both}
.jr .e{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:color-mix(in srgb,var(--c) 18%,transparent)}
.jr .d{font-size:11.5px;color:var(--faint);display:flex;justify-content:space-between;gap:8px}
.jr p{margin:3px 0 0;font-size:13.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:5px 12px;font-size:11.5px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px} .legend i{width:10px;height:10px;border-radius:3px}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:rgba(6,9,18,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 10px calc(env(safe-area-inset-bottom,0px) + 6px)}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
nav .tb{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--faint);padding:6px 0;font-weight:700}
nav .tb.on{color:var(--text)} nav .tb.on .ic{color:var(--gold);filter:drop-shadow(0 0 6px rgba(255,197,77,.7))}
.fabw{display:flex;justify-content:center}
.fab{width:58px;height:58px;border-radius:50%;margin-top:-26px;display:grid;place-items:center;color:#060912;background:linear-gradient(140deg,#ffd77a,#ff9d4d 50%,#ff6ec7);box-shadow:0 0 0 5px var(--bg),0 10px 30px -6px rgba(255,157,77,.8)}
.fab .ic{width:26px;height:26px;stroke-width:2.8}

/* sheet + forms */
.scrim{position:fixed;inset:0;background:rgba(2,4,10,.7);z-index:10;display:none;backdrop-filter:blur(2px)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;max-width:560px;margin:0 auto;max-height:92vh;overflow:auto;background:linear-gradient(180deg,#141d34,#0b1120);border:1px solid var(--line2);border-bottom:0;border-radius:24px 24px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateY(105%);visibility:hidden;transition:transform .28s cubic-bezier(.2,.9,.3,1),visibility 0s .28s;user-select:text}
.open .scrim{display:block}
.open .sheet{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.2,.9,.3,1)}
.grab{width:42px;height:4px;border-radius:4px;background:var(--line2);margin:0 auto 12px}
.sheet h3{margin:0 0 12px;font-family:var(--disp);font-weight:700;font-size:19px}
.sheet h4{margin:16px 0 7px;font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;font-weight:800}
.lbl{font-size:12px;color:var(--muted);margin:12px 0 6px 2px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:99px;background:var(--s2);border:1px solid var(--line2);font-size:13px;font-weight:700;color:var(--muted)}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip.on{color:var(--text);border-color:var(--c,#3cc8ff);background:color-mix(in srgb,var(--c,#3cc8ff) 18%,var(--s2))}
.tog{display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:14px;background:var(--s2);border:1px solid var(--line2)}
.tog button{padding:10px;border-radius:10px;font-weight:800;color:var(--muted)}
.tog button.on.b{background:color-mix(in srgb,var(--up) 22%,var(--s2));color:var(--up)}
.tog button.on.s{background:color-mix(in srgb,var(--dn) 22%,var(--s2));color:var(--dn)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.calc{margin-top:12px;padding:11px 12px;border-radius:14px;background:rgba(6,9,18,.5);border:1px solid var(--line);font-size:13px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.calc b{font-family:var(--disp);font-variant-numeric:tabular-nums}
.btn{display:block;width:100%;padding:13px;border-radius:14px;background:var(--s2);border:1px solid var(--line2);font-weight:800;text-align:center}
.btn:active{transform:scale(.98)}
.btn.pri{background:linear-gradient(135deg,#ffd77a,#ff9d4d 50%,#ff6ec7);border:0;color:#060912;box-shadow:0 8px 28px -12px rgba(255,157,77,.9)}
.btn.danger{color:var(--dn);border-color:rgba(255,93,115,.35)}
.btn.armed{background:rgba(255,93,115,.16);border-color:var(--dn)}
.btn.sm{padding:9px 12px;font-size:13px;width:auto;display:inline-block;border-radius:11px}
.acts{display:flex;gap:8px;margin-top:12px}
.acts .btn{flex:1;white-space:nowrap;padding-inline:8px}
.note{font-size:12px;color:var(--faint);margin-top:10px;line-height:1.45}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kv>div{background:rgba(6,9,18,.5);border:1px solid var(--line);border-radius:13px;padding:9px 11px;min-width:0}
.kv .k{font-size:11px;color:var(--muted)} .kv .v{font-family:var(--disp);font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
th{font-size:10.5px;color:var(--faint);font-weight:800;text-transform:uppercase;letter-spacing:.5px;text-align:right;padding:6px 4px;border-bottom:1px solid var(--line2)}
td{text-align:right;padding:8px 4px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
.tblw{overflow-x:auto}
.txr{cursor:pointer}
pre.code{background:#050810;border:1px solid var(--line2);border-radius:12px;padding:10px;font-size:11px;overflow-x:auto;white-space:pre;color:#bfe9ff;user-select:text;max-height:180px}
.step{display:grid;grid-template-columns:26px 1fr;gap:10px;margin:10px 0;font-size:13px}
.step b{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--s3);color:var(--gold);font-family:var(--disp);font-size:12px}

/* lock (same as VID) */
#lock{position:fixed;inset:0;z-index:50;background:radial-gradient(500px 400px at 50% 30%,rgba(255,157,77,.16),transparent 70%),var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px calc(env(safe-area-inset-bottom,0px) + 24px);user-select:none}
.lorbw{position:relative;width:110px;height:110px;margin-bottom:18px}
.lorb{width:110px;height:110px;border-radius:50%;background:conic-gradient(from 0deg,#ffd77a,#ff9d4d,#ff6ec7,#9d7bff,#3cc8ff,#2ee59d,#ffd77a);animation:rot 6s linear infinite;box-shadow:0 0 60px -10px rgba(255,157,77,.8)}
.lorb::after{content:"";position:absolute;inset:5px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#18223f,#060912 70%)}
.lorbt{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--disp);font-weight:800;font-size:26px;letter-spacing:3px;background:linear-gradient(90deg,#ffe3a0,#ff9ed8);-webkit-background-clip:text;background-clip:text;color:transparent}
#lock h2{margin:0;font-family:var(--disp);font-weight:700;font-size:18px;text-align:center}
#lock p{color:var(--muted);text-align:center;margin:6px 0 16px;font-size:13.5px;max-width:300px}
.pins{display:flex;gap:12px;margin-bottom:18px}
.pins i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line2);transition:.15s}
.pins i.on{background:var(--gold);border-color:var(--gold);box-shadow:0 0 10px var(--gold)}
.pins.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px}
.pad button{height:62px;border-radius:50%;background:var(--s1);border:1px solid var(--line2);font-family:var(--disp);font-weight:700;font-size:22px}
.pad .fp{color:var(--cyan)} .pad .fp .ic{width:28px;height:28px}
.lockerr{color:var(--dn);font-size:13px;min-height:20px;margin:-6px 0 8px;text-align:center}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);transform:translate(-50%,16px);width:min(92vw,440px);display:flex;align-items:center;justify-content:space-between;gap:12px;background:#1a2645;border:1px solid var(--line2);padding:11px 14px;border-radius:16px;font-size:13.5px;opacity:0;transition:.22s;pointer-events:none;z-index:60}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:var(--gold);font-weight:800;white-space:nowrap}
@media (prefers-reduced-motion:reduce){#view,.orb,.orb::before,.hold,.idea,.jr,.lorb{animation:none!important}}
@media (max-width:370px){.big{font-size:29px}.hgrid{grid-template-columns:minmax(0,1fr) 92px}.orb{width:92px;height:92px}}
.alloc .donut{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;align-items:center}
.alloc svg{width:150px;height:150px;display:block;overflow:visible}
.alloc circle.sl{fill:none;transition:stroke-dasharray .9s cubic-bezier(.2,.9,.3,1),stroke-width .2s,opacity .2s;cursor:pointer}
.alloc circle.sl.dim{opacity:.28}
.lg{display:flex;flex-direction:column;gap:2px;min-width:0;max-height:190px;overflow-y:auto}
.lg button{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:8px;align-items:center;text-align:left;padding:5px 6px;border-radius:9px;font-size:12.5px}
.lg button i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.lg button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg button b{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700}
.lg button.on{background:color-mix(in srgb,var(--c) 18%,transparent)}
.lg button.on b{color:var(--text)}
.selinfo{margin-top:10px;padding:10px 12px;border-radius:14px;background:rgba(6,9,18,.5);border:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12.5px;min-height:46px}
.selinfo b{font-family:var(--disp)}
.selinfo button{color:#9fdcff;font-weight:800;white-space:nowrap}
.pbar{display:grid;grid-template-columns:minmax(0,96px) 1fr auto;gap:8px;align-items:center;width:100%;text-align:left;padding:5px 0;font-size:12.5px}
.pbar span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.pbar .tr{height:10px;position:relative;background:var(--s3);border-radius:6px}
.pbar .tr::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--line2)}
.pbar .tr b{position:absolute;top:0;bottom:0;border-radius:6px;transition:width .8s cubic-bezier(.2,.9,.3,1)}
.pbar .v{font-variant-numeric:tabular-nums;font-weight:700;min-width:62px;text-align:right}
.secchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
</style>

</div>

<input type="file" id="fileIn" accept=".json,.csv,application/json,text/csv" hidden>

<script>
(() => {
'use strict';
/* ===================== model ===================== */
const KEY = 'mib.v1', LKEY = 'mib.lock', DAY = 86400000;
const BK = {
  ipo:{l:'IPO allotment', s:'IPO', c:'#ffc54d'}, lst:{l:'Listing-day buy', s:'Listing', c:'#ff6ec7'},
  inv:{l:'Investment', s:'Invest', c:'#3cc8ff'}, spec:{l:'Speculation', s:'Spec', c:'#9d7bff'},
};
const SWATCH = ['#3cc8ff','#2ee59d','#ff6ec7','#ffc54d','#9d7bff','#ff9d4d','#22d3ee','#f472b6','#a3e635','#60a5fa'];
const DEF_ACC = [['rs','Rakesh · SBI','#3cc8ff'],['rz','Rakesh · Zerodha','#2ee59d'],['wz','Wife · Zerodha','#ff6ec7'],['mz','Mom · Zerodha','#ffc54d']].map(([id,name,color]) => ({id,name,color}));
const STAGE = {watch:{l:'Watch', c:'#93a0c3'}, research:{l:'Research', c:'#3cc8ff'}, invested:{l:'Invested', c:'#2ee59d'}, dropped:{l:'Dropped', c:'#ff5d73'}};
const MOODS = [{e:'😱',l:'Fear',c:'#ff5d73'},{e:'😟',l:'Anxious',c:'#ff9d4d'},{e:'😐',l:'Neutral',c:'#93a0c3'},{e:'🙂',l:'Calm',c:'#3cc8ff'},{e:'😎',l:'Confident',c:'#2ee59d'},{e:'🤑',l:'Greedy',c:'#ffc54d'}];
const fresh = () => ({accts:DEF_ACC.map(a => ({...a})), tx:[], divs:[], prices:{}, ideas:[], ipos:[], journal:[], snaps:{}, sheet:'', priceAt:0, sectors:{}});
/* starter sector map for common NSE names; anything else you set once per stock and it is remembered */
const SECTOR0 = {
  'Capital Markets':'BSE MCX CDSL CAMS KFINTECH ANGELONE ANANDRATHI MOTILALOFS NUVAMA 360ONE IIFLCAPS CRISIL CARERATING ICRA NAM-INDIA HDFCAMC UTIAMC ABSLAMC IEX',
  'Banks':'HDFCBANK ICICIBANK SBIN AXISBANK KOTAKBANK INDUSINDBK BANKBARODA PNB CANBK FEDERALBNK IDFCFIRSTB AUBANK UNIONBANK BANDHANBNK YESBANK',
  'Financial Services':'BAJFINANCE BAJAJFINSV CHOLAFIN SHRIRAMFIN MUTHOOTFIN LICHSGFIN PFC RECLTD IRFC JIOFIN POONAWALLA MANAPPURAM SBICARD',
  'Insurance':'SBILIFE HDFCLIFE ICICIPRULI LICI ICICIGI STARHEALTH NIACL GICRE POLICYBZR',
  'IT':'TCS INFY WIPRO HCLTECH TECHM LTIM PERSISTENT COFORGE MPHASIS KPITTECH TATAELXSI OFSS CYIENT',
  'Oil & Gas':'RELIANCE ONGC IOC BPCL HINDPETRO GAIL OIL PETRONET',
  'FMCG':'HINDUNILVR ITC NESTLEIND BRITANNIA DABUR MARICO GODREJCP COLPAL TATACONSUM VBL',
  'Auto':'MARUTI M&M TATAMOTORS BAJAJ-AUTO EICHERMOT HEROMOTOCO TVSMOTOR ASHOKLEY',
  'Auto Components':'BOSCHLTD MOTHERSON BHARATFORG SONACOMS EXIDEIND MRF APOLLOTYRE',
  'Pharma & Health':'SUNPHARMA DRREDDY CIPLA DIVISLAB LUPIN ZYDUSLIFE AUROPHARMA APOLLOHOSP MAXHEALTH FORTIS',
  'Metals':'TATASTEEL JSWSTEEL HINDALCO VEDL SAIL NMDC JINDALSTEL NATIONALUM COALINDIA',
  'Cement & Construction':'ULTRACEMCO SHREECEM AMBUJACEM ACC LT DLF GODREJPROP LODHA OBEROIRLTY',
  'Power & Utilities':'NTPC POWERGRID TATAPOWER ADANIPOWER ADANIGREEN NHPC SJVN JSWENERGY',
  'Capital Goods & Defence':'HAL BEL BHEL SIEMENS ABB CUMMINSIND MAZDOCK BDL COCHINSHIP SOLARINDS',
  'Consumer Durables':'TITAN HAVELLS VOLTAS DIXON CROMPTON BLUESTARCO WHIRLPOOL LGEINDIA KALYANKJIL',
  'Telecom & Media':'BHARTIARTL IDEA INDUSTOWER ZEEL SUNTV',
  'Retail & Internet':'DMART TRENT NYKAA ZOMATO ETERNAL SWIGGY PAYTM NAUKRI IRCTC',
  'Chemicals':'PIDILITIND SRF UPL DEEPAKNTR AARTIIND TATACHEM',
  'Paints':'ASIANPAINT BERGEPAINT',
  'ETF & Funds':'NIFTYBEES GOLDBEES BANKBEES JUNIORBEES SILVERBEES LIQUIDBEES',
};
const SECMAP = {}; Object.entries(SECTOR0).forEach(([sec, list]) => list.split(' ').forEach(t => SECMAP[t] = sec));
const SEC_COL = ['#3cc8ff','#2ee59d','#ff6ec7','#ffc54d','#9d7bff','#ff9d4d','#22d3ee','#f472b6','#a3e635','#60a5fa','#facc15','#fb7185','#34d399','#c084fc'];
const sectorOf = k => (S.sectors || {})[k] || SECMAP[symShort(k)] || 'Unclassified';
const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k) || 'null'); return v ?? d; } catch(e) { return d; } };
let S = {...fresh(), ...load(KEY, {})};
let L = {pinHash:null, salt:null, cred:null, grace:1, ...load(LKEY, {})};
let warned = false;
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) { if (!warned) { warned = true; toast('Could not save on this device'); } } };
const saveL = () => { try { localStorage.setItem(LKEY, JSON.stringify(L)); } catch(e) {} };
const UI = {per:'1Y', alloc:'sector', asel:null, sec:null, tab:'home', acc:'all', bk:'all', hsort:'value', ideaTab:'pipe', stage:'research', iview:'stage', jview:'time', jf:null, F:null, J:{mood:null}};
const TABS = ['home','hold','ideas','journal'];

/* ===================== helpers ===================== */
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => iso(new Date());
const kDate = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); };
const dnum = k => { const [y,m,d] = k.split('-').map(Number); return Date.UTC(y, m-1, d)/DAY; };
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const short = k => { const d = kDate(k); return `${d.getDate()} ${MON[d.getMonth()]} ${String(d.getFullYear()).slice(2)}`; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const r2 = n => Math.round(n*100)/100;
const rs = (n, d = 0) => (n < 0 ? '−' : '') + '₹' + Math.abs(n).toLocaleString('en-IN', {minimumFractionDigits:d, maximumFractionDigits:d});
const rsk = n => { const a = Math.abs(n), s = n < 0 ? '−' : ''; return a >= 1e7 ? `${s}₹${(a/1e7).toFixed(2)}Cr` : a >= 1e5 ? `${s}₹${(a/1e5).toFixed(2)}L` : a >= 1e3 ? `${s}₹${(a/1e3).toFixed(1)}k` : `${s}₹${Math.round(a)}`; };
const sgn = n => n > 0 ? '+' : n < 0 ? '−' : '';
const pct = (a, b) => b ? a/b*100 : 0;
const pctS = p => `${sgn(p)}${Math.abs(p).toFixed(2)}%`;
const cls = n => n > 0 ? 'up' : n < 0 ? 'dn' : 'muted';
const acc = id => S.accts.find(a => a.id === id) || {id, name:id, color:'#93a0c3'};
const symKey = s => { s = String(s || '').trim().toUpperCase().replace(/\s+/g, ''); if (!s) return ''; return s.includes(':') ? s : 'NSE:' + s; };
const symShort = k => k.split(':').pop();
const fy = k => { const d = kDate(k), y = d.getMonth() >= 3 ? d.getFullYear() : d.getFullYear() - 1; return `FY${String(y+1).slice(2)}`; };
const fyStart = () => { const d = new Date(), y = d.getMonth() >= 3 ? d.getFullYear() : d.getFullYear() - 1; return `${y}-04-01`; };
const stamp = t => { const d = new Date(t); return `${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}, ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const ago = t => { const m = Math.round((Date.now() - t)/60000); return m < 1 ? 'just now' : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m/60)} h ago` : `${Math.round(m/1440)} d ago`; };

/* ===================== ledger: FIFO lots per account · symbol · bucket ===================== */
function ledger(){
  const pos = new Map(), realized = [];
  const txs = S.tx.slice().sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : (a.type === 'buy' ? -1 : 1) - (b.type === 'buy' ? -1 : 1) || a.t - b.t);
  for (const x of txs){
    const k = `${x.acct}|${x.sym}|${x.bk}`;
    let p = pos.get(k); if (!p) { p = {key:k, acct:x.acct, sym:x.sym, bk:x.bk, lots:[], realized:0, txs:[]}; pos.set(k, p); }
    p.txs.push(x);
    if (x.type === 'buy') p.lots.push({q:x.qty, p:x.price + (x.chg || 0)/x.qty, d:x.date, id:x.id});
    else {
      let q = x.qty; const net = x.price - (x.chg || 0)/x.qty;
      while (q > 1e-9 && p.lots.length){
        const lot = p.lots[0], take = Math.min(q, lot.q), held = dnum(x.date) - dnum(lot.d);
        const pnl = (net - lot.p) * take;
        realized.push({acct:x.acct, sym:x.sym, bk:x.bk, q:take, buy:lot.p, sell:net, bd:lot.d, sd:x.date, pnl, lt:held > 365, txId:x.id});
        p.realized += pnl; lot.q -= take; q -= take; if (lot.q <= 1e-9) p.lots.shift();
      }
    }
  }
  const holds = [...pos.values()].map(p => {
    const qty = p.lots.reduce((a,l) => a + l.q, 0), inv = p.lots.reduce((a,l) => a + l.q*l.p, 0), pr = S.prices[p.sym] || {};
    const cmp = pr.cmp ?? null, val = cmp != null ? qty*cmp : inv, ltq = p.lots.filter(l => dnum(today()) - dnum(l.d) > 365).reduce((a,l) => a + l.q, 0);
    const day = cmp != null && pr.prev ? (cmp - pr.prev)*qty : 0;
    return {...p, qty, inv, avg: qty ? inv/qty : 0, cmp, val, pnl: val - inv, pp: pct(val - inv, inv), day, dayP: pr.prev ? pct(cmp - pr.prev, pr.prev) : 0, ltq, first: p.lots[0] ? p.lots[0].d : null, priced: cmp != null};
  });
  return {holds, open: holds.filter(h => h.qty > 1e-9), realized};
}
function agg(list){
  const inv = list.reduce((a,h) => a + h.inv, 0), val = list.reduce((a,h) => a + h.val, 0), day = list.reduce((a,h) => a + h.day, 0);
  return {inv, val, pnl: val - inv, pp: pct(val - inv, inv), day, dayP: pct(day, val - day), n: list.length};
}
const fAcc = l => UI.acc === 'all' ? l : l.filter(h => h.acct === UI.acc);
const divSum = (from) => S.divs.filter(d => (UI.acc === 'all' || d.acct === UI.acc) && (!from || d.date >= from)).reduce((a,d) => a + d.amt, 0);

/* ===================== prices from a published Google Sheet ===================== */
function parseCSV(t){
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < t.length; i++){ const c = t[i];
    if (q) { if (c === '"' && t[i+1] === '"') { f += '"'; i++; } else if (c === '"') q = false; else f += c; }
    else if (c === '"') q = true; else if (c === ',') { row.push(f); f = ''; } else if (c === '\n' || c === '\r') { if (c === '\r' && t[i+1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; } else f += c; }
  if (f || row.length) { row.push(f); rows.push(row); }
  return rows;
}
const numv = s => { const n = parseFloat(String(s ?? '').replace(/[₹,\s]/g, '')); return isFinite(n) ? n : null; };
function applyPriceRows(rows){
  let n = 0; const now = Date.now();
  rows.forEach(r => { const k = symKey(r[0]), c = numv(r[1]), p = numv(r[2]);
    if (!k || k === 'NSE:SYMBOL' || c == null) return; const old = S.prices[k];
    if (old && old.src === 'manual' && old.lock) return;
    S.prices[k] = {cmp:c, prev:p ?? (old && old.prev) ?? null, at:now, src:'sheet'}; n++; });
  return n;
}
let fetching = false;
async function refreshPrices(quiet){
  if (!S.sheet || fetching) { if (!quiet && !S.sheet) sheetSetup(); return; }
  fetching = true; $('refBtn').classList.add('spin');
  try {
    const res = await fetch(S.sheet, {cache:'no-store'}); if (!res.ok) throw new Error('HTTP ' + res.status);
    const n = applyPriceRows(parseCSV(await res.text())); S.priceAt = Date.now(); snapshot(); save(); render(false);
    const miss = symbols().filter(k => !S.prices[k] || S.prices[k].cmp == null);
    if (!quiet) toast(`${n} prices updated${miss.length ? ` · ${miss.length} missing from your sheet` : ''}`);
  } catch(e) { if (!quiet) toast('Could not reach your price sheet. Check the link in Settings, or try again on Wi-Fi.'); }
  fetching = false; $('refBtn').classList.remove('spin');
}
const symbols = () => [...new Set([...S.tx.map(x => x.sym), ...S.ideas.map(i => i.sym).filter(Boolean)])].sort();
function sheetText(list){
  return 'Symbol\tPrice\tPrevClose\n' + list.map(k => `${k}\t=IFERROR(GOOGLEFINANCE(INDIRECT("A"&ROW()),"price"),"")\t=IFERROR(GOOGLEFINANCE(INDIRECT("A"&ROW()),"closeyest"),"")`).join('\n');
}
function snapshot(){
  const {open, realized} = ledger(); if (!open.length) return;
  const one = id => { const l = id ? open.filter(h => h.acct === id) : open, g = agg(l), rz = realized.filter(r => !id || r.acct === id).reduce((s,r) => s + r.pnl, 0), dv = S.divs.filter(d => !id || d.acct === id).reduce((s,d) => s + d.amt, 0);
    return {v:Math.round(g.val), i:Math.round(g.inv), g:Math.round(g.pnl + rz + dv)}; };

/* ---------- interactive allocation donut ---------- */
function groups(list, dim){
  const m = new Map();
  list.forEach(x => { const k = dim === 'sector' ? sectorOf(x.sym) : dim === 'stock' ? symShort(x.sym) : dim === 'acct' ? x.acct : x.bk;
    const g = m.get(k) || {k, val:0, inv:0, n:0}; g.val += x.val; g.inv += x.inv; g.n++; m.set(k, g); });
  let arr = [...m.values()].sort((a,b) => b.val - a.val);
  if (dim === 'stock' && arr.length > 10) { const rest = arr.slice(9); arr = arr.slice(0, 9); arr.push({k:`Others (${rest.length})`, val:rest.reduce((s,g) => s + g.val, 0), inv:rest.reduce((s,g) => s + g.inv, 0), n:rest.length, others:true}); }
  return arr.map((g, i) => ({...g, label: dim === 'acct' ? acc(g.k).name : dim === 'bk' ? BK[g.k].l : g.k,
    color: dim === 'acct' ? acc(g.k).color : dim === 'bk' ? BK[g.k].c : g.k === 'Unclassified' || g.others ? '#5b6890' : SEC_COL[i % SEC_COL.length]}));
}

  const sel = gs.find(g => g.k === UI.asel);

  const center = sel ? `<text x="75" y="70" text-anchor="middle" font-family="Sora,system-ui" font-weight="800" font-size="20" fill="${sel.color}">${(sel.val/tot*100).toFixed(1)}%</text><text x="75" y="88" text-anchor="middle" font-size="10" fill="#93a0c3" font-family="Plus Jakarta Sans,system-ui">${esc(sel.label.slice(0,16))}</text>`

  const info = sel ? (() => { const pl = sel.val - sel.inv, pp = pct(pl, sel.inv);

    : '<span class="faint">Tap a slice or a name to see its value and P&L.</span>';

    <div class="seg" style="margin-bottom:12px">${[['sector','Sector'],['stock','Stock'],['acct','Account'],['bk','Bucket']].map(([k,l]) => `<button class="${dim === k ? 'on' : ''}" data-act="adim" data-v="${k}">${l}</button>`).join('')}</div>

}
function sectorPnl(list){

function moodChart(){
  const days = 45, t = today(), W = 340, H = 130, top = 12, base = H - 18;
  const ent = S.journal.filter(e => dnum(t) - dnum(iso(new Date(e.t))) < days); if (ent.length < 2) return '';
  const X = k => (1 - (dnum(t) - dnum(k))/(days - 1))*W, Ym = m => base - m/5*(base - top);
  const ks = Object.keys(S.snaps).filter(k => dnum(t) - dnum(k) < days).sort(), vals = ks.map(k => snapOf(k, 'all').v), mn = Math.min(...vals), mx = Math.max(...vals);
  const Yv = v => base - (mx === mn ? .5 : (v - mn)/(mx - mn))*(base - top);
  let g = MOODS.map((m,i) => `<line x1="0" x2="${W}" y1="${Ym(i).toFixed(1)}" y2="${Ym(i).toFixed(1)}" stroke="#1a2440"/>`).join('');
  if (ks.length > 1) g += `<path d="${ks.map((k,i) => `${i ? 'L' : 'M'}${X(k).toFixed(1)},${Yv(snapOf(k, 'all').v).toFixed(1)}`).join(' ')}" fill="none" stroke="#ffc54d" stroke-width="1.8" opacity=".75"/>`;
  ent.forEach(e => { const k = iso(new Date(e.t)), m = MOODS[e.mood]; g += `<text x="${X(k).toFixed(1)}" y="${(Ym(e.mood) + 5).toFixed(1)}" text-anchor="middle" font-size="13">${m.e}</text>`; });
  g += `<text x="0" y="${H-3}" font-size="9.5" fill="#93a0c3" font-family="Plus Jakarta Sans,system-ui">${days} days ago</text><text x="${W}" y="${H-3}" text-anchor="end" font-size="9.5" fill="#93a0c3" font-family="Plus Jakarta Sans,system-ui">today</text>`;
  return `<section class="card chart"><div class="ch"><h3>Mood vs portfolio</h3></div><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Mood entries against portfolio value">${g}</svg>
    <div class="legend"><span>Emoji height = mood, fear at the bottom, greed at the top</span><span><i style="background:#ffc54d"></i>Net worth</span></div></section>`;
}

function importData(file){
  if (!file) return; const r = new FileReader();
  r.onload = () => { try {
    const txt = r.result;
    if (/^\s*\{/.test(txt)) {
      const d = JSON.parse(txt);
      if (d.app !== 'MIB') throw 0;
      if (d.kind === 'backup') {
        const merge = (key, f = 'id') => { const have = new Set((S[key] || []).map(x => x[f])); let n = 0; (d[key] || []).forEach(x => { if (!have.has(x[f])) { S[key].push(x); n++; } }); return n; };
        const n = merge('tx'); merge('divs'); merge('ideas'); merge('ipos'); merge('journal'); merge('accts');
        S.sectors = {...(d.sectors || {}), ...(S.sectors || {})}; Object.assign(S.prices, d.prices || {}); Object.entries(d.snaps || {}).forEach(([k,v]) => { if (!(k in S.snaps)) S.snaps[k] = v; }); if (!S.sheet && d.sheet) S.sheet = d.sheet;
